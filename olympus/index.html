<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#111216">
    <title>Olympus · Aegis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111216'/%3E%3Cpath d='M12 3.5 5 6.2v5.1c0 4.3 2.9 8 7 9.2 4.1-1.2 7-4.9 7-9.2V6.2z' fill='none' stroke='%232ed3bd' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M12 3.5v17' stroke='%232ed3bd' stroke-width='1.8'/%3E%3C/svg%3E">
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem("olympus.theme");
        var light = stored === "light" || (stored !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
